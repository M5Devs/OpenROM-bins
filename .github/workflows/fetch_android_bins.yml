name: Fetch Android ARM64 Binaries

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run mode"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-and-verify:
    name: Fetch & Verify Android ARM64 Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu tar curl file

      - name: Fetch static chdman
        run: |
          npm pack @emmercm/chdman-linux-arm64
          tar -xzf emmercm-chdman-linux-arm64-*.tgz
          mkdir -p artifact_dir
          cp package/dist/chdman artifact_dir/chdman
          rm -rf package emmercm-*.tgz

      - name: Verify Android Static Linking
        run: |
          python3 -c '
          import subprocess, sys, glob

          files = glob.glob("artifact_dir/*")
          for f in files:
              res = subprocess.check_output(["file", f]).decode()
              print(f"File check for {f}: {res.strip()}")
              if "statically linked" not in res and "static-pie" not in res:
                  print(f"Warning: {f} is not explicitly statically linked!")
          '

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-chdman
          path: artifact_dir/chdman

  publish-chdman:
    needs: fetch-and-verify
    uses: ./.github/workflows/publish-sourceforge.yml
    with:
      os: android
      arch: arm64-v8a
      tool: chdman
      artifact_name: android-chdman
      version: mame0289
      build_flavor: same_as_linux_arm64
      dry_run: ${ inputs.dry_run }
