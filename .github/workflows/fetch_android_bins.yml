name: 🤖 Fetch & Pack Android ARM64 Binaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-android-bins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenROM-bins
        uses: actions/checkout@v4

      - name: Setup Target Directory & Cross-Compilers
        run: |
          mkdir -p android/arm64-v8a
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu zlib1g-dev

      # 1. سحب chdman (نسخة Static MUSL ARM64 الرسمية المضمونة)
      - name: Fetch Static chdman (aarch64)
        run: |
          echo "⬇️ Fetching static musl chdman for ARM64..."
          npm pack @emmercm/chdman-linux-musl-arm64-v8
          tar -xzf emmercm-chdman-linux-musl-arm64-v8-*.tgz
          cp package/chdman android/arm64-v8a/chdman
          rm -rf package emmercm-*.tgz

      # 2. بناء ecm و unecm بنظام Static للأندرويد
      - name: Build static ecm & unecm (aarch64)
        run: |
          echo "🔨 Compiling ecm & unecm..."
          git clone --depth 1 https://github.com/blit0/unecm.git /tmp/ecm_src
          aarch64-linux-gnu-gcc -O3 -static /tmp/ecm_src/ecm.c -o android/arm64-v8a/ecm
          aarch64-linux-gnu-gcc -O3 -static /tmp/ecm_src/unecm.c -o android/arm64-v8a/unecm
          rm -rf /tmp/ecm_src

      # 3. بناء xdelta3 بنظام Static للأندرويد
      - name: Build static xdelta3 (aarch64)
        run: |
          echo "🔨 Compiling xdelta3..."
          git clone --depth 1 https://github.com/jmacd/xdelta.git /tmp/xdelta_src
          cd /tmp/xdelta_src/xdelta3
          aarch64-linux-gnu-gcc -O3 -static xdelta3.c -o $GITHUB_WORKSPACE/android/arm64-v8a/xdelta3
          rm -rf /tmp/xdelta_src

      # 4. نسخ nkit المتوافق بالفعل مع arm64
      - name: Copy NKit (aarch64)
        run: |
          if [ -f "linux/arm64/nkit" ]; then
            cp linux/arm64/nkit android/arm64-v8a/nkit
          fi

      # 5. تنظيف الصلاحيات وتوليد ملف Checksums المحدث
      - name: Finalize & Generate Checksums
        run: |
          chmod +x android/arm64-v8a/*
          rm -f android/arm64-v8a/.gitkeep
          
          echo "📦 Acquired Android Binaries:"
          ls -lh android/arm64-v8a/
          
          # فحص إن الملفات كلها ARM64
          file android/arm64-v8a/*
          
          # إعادة توليد البصمات لكامل الريبو
          find windows linux macos android -type f \( -name "*.exe" -o ! -name "*.*" \) -exec sha256sum {} + | sort -k 2 > checksums.sha256
          sed -i 's/\r$//' checksums.sha256

      # 6. الرفع التلقائي للريبو
      - name: Commit and Push Android Binaries
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(android): pack verified static ARM64-v8a binaries & update checksums"
