name: Update & Push Binary to SourceForge

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Target OS'
        required: true
        type: choice
        options:
          - windows
          - linux
          - macos
          - android
      target_arch:
        description: 'Architecture'
        required: true
        type: choice
        options:
          - x86_64
          - arm64
          - arm64-v8a
      tool_name:
        description: 'Tool Key in versions.json (e.g. chdman, maxcso)'
        required: true
        type: string
      binary_filename:
        description: 'Binary Filename (e.g. chdman.exe or chdman)'
        required: true
        type: string
      download_url:
        description: 'Direct Download URL from upstream release'
        required: true
        type: string
      new_version:
        description: 'New Version String (e.g. mame0290, 1.4.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync jq curl

      - name: Download New Binary
        run: |
          mkdir -p temp_bin
          echo "Downloading from: ${{ inputs.download_url }}"
          curl -L -f -o "temp_bin/${{ inputs.binary_filename }}" "${{ inputs.download_url }}"
          chmod +x "temp_bin/${{ inputs.binary_filename }}"

      - name: Upload to SourceForge
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SF_PASS: ${{ secrets.SF_PASS }}
        run: |
          TARGET_DIR="/home/frs/project/openrom-binaries/${{ inputs.target_os }}/${{ inputs.target_arch }}/"
          echo "Uploading to SourceForge: $TARGET_DIR"
          sshpass -p "$SF_PASS" rsync -avP -e 'ssh -o StrictHostKeyChecking=no' \
            "temp_bin/${{ inputs.binary_filename }}" \
            $SF_USER@frs.sourceforge.net:"$TARGET_DIR"

      - name: Update versions.json & checksums.sha256
        run: |
          # 1. Update version in versions.json
          jq '.["${{ inputs.tool_name }}"] = "${{ inputs.new_version }}"' versions.json > versions.tmp && mv versions.tmp versions.json

          # 2. Calculate new SHA256
          NEW_HASH=$(sha256sum "temp_bin/${{ inputs.binary_filename }}" | awk '{print $1}')
          REL_PATH="${{ inputs.target_os }}/${{ inputs.target_arch }}/${{ inputs.binary_filename }}"
          
          # 3. Replace or append hash in checksums.sha256
          if grep -q "$REL_PATH" checksums.sha256; then
            sed -i "s|.*  $REL_PATH|$NEW_HASH  $REL_PATH|" checksums.sha256
          else
            echo "$NEW_HASH  $REL_PATH" >> checksums.sha256
          fi
          
          # Sort checksums cleanly
          sort -k2 -o checksums.sha256 checksums.sha256

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json checksums.sha256
          git commit -m "chore: bump ${{ inputs.tool_name }} to ${{ inputs.new_version }} (${{ inputs.target_os }}/${{ inputs.target_arch }})"
          git push origin main
