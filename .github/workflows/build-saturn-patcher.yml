name: Build saturn-patcher

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "saturn-patcher git tag or 40-char SHA (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      version:
        description: "Version string (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      dry_run:
        description: "Dry run publish to SourceForge"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenROM-bins
        uses: actions/checkout@v4

      - name: Validate source_ref Input
        env:
          REF: ${ inputs.source_ref }
        run: |
          python3 -c '
          import os, sys, re
          ref = os.environ.get("REF", "")
          if not re.match(r"^[A-Za-z0-9._/-]+$", ref):
              sys.exit("Invalid source_ref input: " + ref)
          print("source_ref validated:", ref)
          '

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get install -y -q musl-tools

      - name: Clone saturn-patcher
        env:
          REF: ${ inputs.source_ref }
        run: |
          git clone https://github.com/M5Devs/saturn-patcher.git saturn_src
          cd saturn_src
          git checkout "$REF"
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "SOURCE_COMMIT=$COMMIT_SHA" >> $GITHUB_ENV

      - name: Build musl binary
        run: |
          cd saturn_src
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p ../artifact_dir
          cp target/x86_64-unknown-linux-musl/release/saturn-patcher ../artifact_dir/saturn-patcher

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saturn-patcher-linux-x86_64
          path: artifact_dir/saturn-patcher

  publish-linux-x64:
    needs: build-linux-x64
    uses: ./.github/workflows/publish-sourceforge.yml
    with:
      os: linux
      arch: x86_64
      tool: saturn-patcher
      artifact_name: saturn-patcher-linux-x86_64
      version: ${ inputs.version }
      source_ref: ${ inputs.source_ref }
      toolchain: "rustc 1.85.0 (x86_64-unknown-linux-musl)"
      build_flavor: release
      dry_run: ${ inputs.dry_run }
