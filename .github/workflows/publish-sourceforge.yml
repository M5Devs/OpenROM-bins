name: Publish to SourceForge

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
        description: "Target OS e.g. linux, windows, macos, android"
      arch:
        required: true
        type: string
        description: "Target Arch e.g. x86_64, arm64, arm64-v8a"
      tool:
        required: true
        type: string
        description: "Tool canonical key e.g. chdman, nkit, xgdtool"
      artifact_name:
        required: true
        type: string
        description: "GitHub Actions artifact name containing the binary"
      version:
        required: false
        type: string
        description: "Version of the tool e.g. 1.0.0"
      source_ref:
        required: false
        type: string
        description: "Git tag or ref built"
      source_commit:
        required: false
        type: string
        description: "40-char git commit SHA"
      toolchain:
        required: false
        type: string
        description: "Compiler/toolchain version"
      build_flavor:
        required: false
        type: string
        description: "Build flavor e.g. nativeaot"
      dry_run:
        required: false
        type: boolean
        default: true
        description: "Dry run mode (default true)"

  workflow_dispatch:
    inputs:
      os:
        required: true
        type: choice
        options:
          - windows
          - linux
          - macos
          - android
      arch:
        required: true
        type: choice
        options:
          - x86_64
          - arm64
          - arm64-v8a
      tool:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      version:
        required: false
        type: string
      source_ref:
        required: false
        type: string
      source_commit:
        required: false
        type: string
      toolchain:
        required: false
        type: string
      build_flavor:
        required: false
        type: string
      dry_run:
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    name: Publish ${{ inputs.tool }} (${{ inputs.os }}/${{ inputs.arch }})
    runs-on: ubuntu-22.04
    concurrency:
      group: publish-${{ inputs.os }}-${{ inputs.arch }}-${{ inputs.tool }}
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Inputs
        env:
          IN_OS: ${{ inputs.os }}
          IN_ARCH: ${{ inputs.arch }}
          IN_TOOL: ${{ inputs.tool }}
          IN_ARTIFACT: ${{ inputs.artifact_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_SOURCE_REF: ${{ inputs.source_ref }}
          IN_SOURCE_COMMIT: ${{ inputs.source_commit }}
          IN_TOOLCHAIN: ${{ inputs.toolchain }}
          IN_BUILD_FLAVOR: ${{ inputs.build_flavor }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/validate_publish_inputs.py

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: download_artifact

      - name: Verify Artifact & Compute SHA-256
        id: compute
        env:
          TOOL: ${{ inputs.tool }}
          TARGET_OS: ${{ inputs.os }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: python3 scripts/check_publish_artifact.py

      - name: Setup SSH for SourceForge Upload
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SF_SSH_PRIVATE_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SF_SSH_PRIVATE_KEY" ]; then
            if [ "$DRY_RUN" = "false" ]; then
              echo "::error::dry_run=false but SF_USER / SF_SSH_PRIVATE_KEY are not set; refusing to continue."
              exit 1
            fi
            echo "::notice::SF_USER or SF_SSH_PRIVATE_KEY missing; dry run continues without uploading."
            exit 0
          fi

          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SF_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          cp scripts/sourceforge_known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "Pinned SourceForge host key fingerprints:"
          ssh-keygen -lf "$HOME/.ssh/known_hosts"

      - name: Rsync to SourceForge (or Dry Run)
        env:
          SF_USER: ${{ secrets.SF_USER }}
          TARGET_OS: ${{ inputs.os }}
          TARGET_ARCH: ${{ inputs.arch }}
          FILENAME: ${{ steps.compute.outputs.filename }}
          TARGET_FILE: ${{ steps.compute.outputs.target_file }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          REMOTE_DIR="/home/frs/project/openrom-binaries/$TARGET_OS/$TARGET_ARCH/"
          DEST="$SF_USER@frs.sourceforge.net:$REMOTE_DIR$FILENAME"

          if [ ! -f "$HOME/.ssh/id_ed25519" ]; then
            echo "=== DRY RUN (SSH not configured): would upload $TARGET_FILE -> SourceForge:$REMOTE_DIR$FILENAME ==="
            exit 0
          fi

          ssh_cmd="ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -i $HOME/.ssh/id_ed25519"
          args=(-avP -e "$ssh_cmd")
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY RUN MODE ENABLED ==="
            echo "Would upload $TARGET_FILE -> SourceForge:$REMOTE_DIR$FILENAME"
            args+=(--dry-run)
          else
            echo "Uploading $TARGET_FILE -> SourceForge:$REMOTE_DIR$FILENAME"
          fi

          rsync "${args[@]}" "$TARGET_FILE" "$DEST"

      - name: Update Manifest Entry
        env:
          TOOL: ${{ inputs.tool }}
          TARGET_OS: ${{ inputs.os }}
          TARGET_ARCH: ${{ inputs.arch }}
          FILENAME: ${{ steps.compute.outputs.filename }}
          SHA256: ${{ steps.compute.outputs.sha256 }}
          SIZE: ${{ steps.compute.outputs.size }}
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TOOLCHAIN: ${{ inputs.toolchain }}
          BUILD_FLAVOR: ${{ inputs.build_flavor }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          REL_PATH="$TARGET_OS/$TARGET_ARCH/$FILENAME"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          args=(--tool "$TOOL" --os "$TARGET_OS" --arch "$TARGET_ARCH" --file-path "$REL_PATH" --sha256 "$SHA256" --size "$SIZE" --built-at "$NOW" --workflow-run-url "$RUN_URL")
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ -n "$SOURCE_REF" ]; then args+=(--source-ref "$SOURCE_REF"); fi
          if [ -n "$SOURCE_COMMIT" ]; then args+=(--source-commit "$SOURCE_COMMIT"); fi
          if [ -n "$TOOLCHAIN" ]; then args+=(--toolchain "$TOOLCHAIN"); fi
          if [ -n "$BUILD_FLAVOR" ]; then args+=(--build-flavor "$BUILD_FLAVOR"); fi

          python3 scripts/update_manifest_entry.py "${args[@]}"

      - name: Validate Manifest
        run: python3 scripts/validate_manifest.py

      - name: Write Step Summary
        env:
          TOOL: ${{ inputs.tool }}
          TARGET_OS: ${{ inputs.os }}
          TARGET_ARCH: ${{ inputs.arch }}
          FILENAME: ${{ steps.compute.outputs.filename }}
          SHA256: ${{ steps.compute.outputs.sha256 }}
          SIZE: ${{ steps.compute.outputs.size }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            printf '%s\n' '### 🚀 SourceForge Publish Summary'
            printf '%s\n' '| Field | Value |'
            printf '%s\n' '|---|---|'
            printf '| **Tool** | \x60%s\x60 |\n' "$TOOL"
            printf '| **Target** | \x60%s/%s\x60 |\n' "$TARGET_OS" "$TARGET_ARCH"
            printf '| **Filename** | \x60%s\x60 |\n' "$FILENAME"
            printf '| **SHA-256** | \x60%s\x60 |\n' "$SHA256"
            printf '| **Size** | %s bytes |\n' "$SIZE"
            printf '| **Dry Run** | \x60%s\x60 |\n' "$DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open Pull Request for Manifest Updates
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOL: ${{ inputs.tool }}
          TARGET_OS: ${{ inputs.os }}
          TARGET_ARCH: ${{ inputs.arch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          CHANGED=$(git status --porcelain)
          if [ -z "$CHANGED" ]; then
            echo "::error::No manifest changes were produced; nothing to publish."
            exit 1
          fi

          unexpected=$(printf '%s\n' "$CHANGED" | awk '{print $2}' | grep -v -x -e manifest.json -e checksums.sha256 -e versions.json || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected files changed, refusing to open a PR:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          BRANCH_NAME="publish-$TOOL-$TARGET_OS-$TARGET_ARCH-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add manifest.json checksums.sha256 versions.json
          git commit -m "chore(publish): update manifest for $TOOL ($TARGET_OS/$TARGET_ARCH)"
          git push origin "$BRANCH_NAME"
          gh pr create \
            --title "Publish $TOOL for $TARGET_OS/$TARGET_ARCH" \
            --body "Automated publish update for $TOOL on $TARGET_OS/$TARGET_ARCH." \
            --base main \
            --head "$BRANCH_NAME"
