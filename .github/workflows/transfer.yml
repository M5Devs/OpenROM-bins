name: Transfer Binaries to SourceForge

on:
  workflow_dispatch: # تشغيل يدوي بضغطة زرار من جيت هاب

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Sync OS Folders to SourceForge
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SF_PASS: ${{ secrets.SF_PASS }}
        run: |
          # هنا بنحدد فقط الفولدرات الأربعة اللي عايزين ننقلها
          sshpass -p "$SF_PASS" rsync -avP -e 'ssh -o StrictHostKeyChecking=no' \
            android linux macos windows \
            $SF_USER@frs.sourceforge.net:/home/frs/project/openrom-binaries/
