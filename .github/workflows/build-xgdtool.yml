name: Build XGDTool

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "XGDTool git tag or 40-char SHA (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      version:
        description: "Version string (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      dry_run:
        description: "Dry run publish to SourceForge"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenROM-bins
        uses: actions/checkout@v4

      - name: Validate source_ref Input
        env:
          REF: ${ inputs.source_ref }
        run: |
          python3 -c '
          import os, sys, re
          ref = os.environ.get("REF", "")
          if not re.match(r"^[A-Za-z0-9._/-]+$", ref):
              sys.exit("Invalid source_ref input: " + ref)
          print("source_ref validated:", ref)
          '

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake make pkg-config \
            liblz4-dev libzstd-dev libssl-dev libcurl4-openssl-dev

      - name: Clone XGDTool
        env:
          REF: ${ inputs.source_ref }
        run: |
          git clone --recursive https://github.com/wiredopposite/XGDTool.git xgd_src
          cd xgd_src
          git checkout "$REF"
          git submodule update --init --recursive
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "SOURCE_COMMIT=$COMMIT_SHA" >> $GITHUB_ENV

      - name: Build XGDTool
        run: |
          cd xgd_src
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          mkdir -p ../../artifact_dir
          cp XGDTool ../../artifact_dir/XGDTool
          echo "Shared library dependencies (ldd):"
          ldd ../../artifact_dir/XGDTool || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgdtool-linux-x86_64
          path: artifact_dir/XGDTool

  publish-linux-x64:
    needs: build-linux-x64
    uses: ./.github/workflows/publish-sourceforge.yml
    with:
      os: linux
      arch: x86_64
      tool: xgdtool
      artifact_name: xgdtool-linux-x86_64
      version: ${ inputs.version }
      source_ref: ${ inputs.source_ref }
      toolchain: "GCC / CMake Linux"
      build_flavor: release
      dry_run: ${ inputs.dry_run }
