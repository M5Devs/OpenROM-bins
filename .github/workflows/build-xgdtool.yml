name: Build XGDTool

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      source_ref:
        description: "Upstream git tag or 40-char commit SHA (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      dry_run:
        description: "Dry run publish to SourceForge"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: https://github.com/wiredopposite/XGDTool.git

jobs:
  resolve:
    name: Resolve upstream commit
    runs-on: ubuntu-22.04
    outputs:
      source_commit: ${{ steps.resolve.outputs.source_commit }}
    steps:
      - name: Validate Inputs
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.source_ref }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          version = os.environ.get("VERSION", "")
          ref = os.environ.get("REF", "")

          if not re.fullmatch(r"[A-Za-z0-9._+-]{1,64}", version):
              sys.exit(f"Invalid version input: {version!r}")
          if not re.fullmatch(r"[A-Za-z0-9._/-]{1,128}", ref):
              sys.exit(f"Invalid source_ref input: {ref!r}")

          print("version validated:", version)
          print("source_ref validated:", ref)
          PY

      - name: Clone upstream and resolve commit
        id: resolve
        env:
          REF: ${{ inputs.source_ref }}
        run: |
          git clone --recursive "$UPSTREAM_REPO" xgd_src
          cd xgd_src || exit 1
          git checkout --detach "$REF"
          COMMIT=$(git rev-parse HEAD)
          if ! printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::resolved commit is not a 40-char hex SHA: $COMMIT"
            exit 1
          fi
          echo "Resolved $REF -> $COMMIT"
          echo "source_commit=$COMMIT" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target.os }}/${{ matrix.target.arch }}
    needs: resolve
    runs-on: ${{ matrix.target.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            bin: XGDTool
            artifact: xgdtool-linux-x86_64
            tc_key: toolchain_linux_x86_64
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            bin: XGDTool
            artifact: xgdtool-linux-arm64
            tc_key: toolchain_linux_arm64
          - os: windows
            arch: x86_64
            runner: windows-2022
            bin: XGDTool.exe
            artifact: xgdtool-windows-x86_64
            tc_key: toolchain_windows_x86_64
    outputs:
      toolchain_linux_x86_64: ${{ steps.toolchain.outputs.toolchain_linux_x86_64 }}
      toolchain_linux_arm64: ${{ steps.toolchain.outputs.toolchain_linux_arm64 }}
      toolchain_windows_x86_64: ${{ steps.toolchain.outputs.toolchain_windows_x86_64 }}
    steps:
      - name: Checkout XGDTool at resolved commit
        uses: actions/checkout@v4
        with:
          repository: wiredopposite/XGDTool
          ref: ${{ needs.resolve.outputs.source_commit }}
          path: xgd_src

      - name: Init submodules
        run: |
          cd xgd_src || exit 1
          git submodule update --init --recursive

      - name: Install dependencies
        if: matrix.target.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake make pkg-config \
            liblz4-dev libzstd-dev libssl-dev libcurl4-openssl-dev

      - name: Read toolchain version
        id: toolchain
        env:
          TC_KEY: ${{ matrix.target.tc_key }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            MSVC=$("$VSWHERE" -latest -products '*' -property installationVersion)
            TC="MSVC ${MSVC} (Visual Studio 17 2022)"
          else
            TC=$(clang --version | head -n1)
          fi
          echo "Toolchain: $TC"
          echo "$TC_KEY=$TC" >> "$GITHUB_OUTPUT"

      - name: Configure (Linux)
        if: matrix.target.os == 'linux'
        run: |
          cmake -S xgd_src -B xgd_src/build \
            -DENABLE_GUI=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Configure (Windows)
        if: matrix.target.os == 'windows'
        run: |
          cmake -S xgd_src -B xgd_src/build \
            -G "Visual Studio 17 2022" -A x64 \
            -DENABLE_GUI=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux)
        if: matrix.target.os == 'linux'
        run: |
          cd xgd_src/build || exit 1
          make -j"$(nproc)"

      - name: Build (Windows)
        if: matrix.target.os == 'windows'
        run: |
          cmake --build xgd_src/build --config Release

      - name: Collect artifact
        env:
          BIN_NAME: ${{ matrix.target.bin }}
          OS_NAME: ${{ matrix.target.os }}
        run: |
          mkdir -p artifact_dir
          if [ "$OS_NAME" = "windows" ]; then
            cp "xgd_src/build/Release/$BIN_NAME" "artifact_dir/$BIN_NAME"
          else
            cp "xgd_src/build/$BIN_NAME" "artifact_dir/$BIN_NAME"
          fi

      - name: Record shared library dependencies
        if: matrix.target.os == 'linux'
        env:
          BIN_NAME: ${{ matrix.target.bin }}
        run: |
          {
            echo '### XGDTool shared library dependencies (ldd)'
            echo '```'
            ldd "artifact_dir/$BIN_NAME" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: artifact_dir/${{ matrix.target.bin }}
          if-no-files-found: error

  publish:
    name: Publish XGDTool (${{ matrix.target.os }}/${{ matrix.target.arch }})
    needs: [resolve, build]
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            arch: x86_64
            artifact: xgdtool-linux-x86_64
            toolchain: ${{ needs.build.outputs.toolchain_linux_x86_64 }}
          - os: linux
            arch: arm64
            artifact: xgdtool-linux-arm64
            toolchain: ${{ needs.build.outputs.toolchain_linux_arm64 }}
          - os: windows
            arch: x86_64
            artifact: xgdtool-windows-x86_64
            toolchain: ${{ needs.build.outputs.toolchain_windows_x86_64 }}
    uses: ./.github/workflows/publish-sourceforge.yml
    with:
      os: ${{ matrix.target.os }}
      arch: ${{ matrix.target.arch }}
      tool: xgdtool
      artifact_name: ${{ matrix.target.artifact }}
      version: ${{ inputs.version }}
      source_ref: ${{ inputs.source_ref }}
      source_commit: ${{ needs.resolve.outputs.source_commit }}
      toolchain: ${{ matrix.target.toolchain }}
      build_flavor: release
      dry_run: ${{ inputs.dry_run }}
