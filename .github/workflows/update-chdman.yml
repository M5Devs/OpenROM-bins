name: Update chdman

on:
  workflow_dispatch:
    inputs:
      version:
        description: "chdman version e.g. 0.289.0"
        required: true
        default: "0.289.0"
      dry_run:
        description: "Dry run publish to SourceForge"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  extract-and-publish:
    name: Extract & Publish chdman v${ inputs.version }
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux
            arch: x86_64
            pkg: "@emmercm/chdman-linux-x64"
            filename: chdman
          - os: linux
            arch: arm64
            pkg: "@emmercm/chdman-linux-arm64"
            filename: chdman
          - os: macos
            arch: x86_64
            pkg: "@emmercm/chdman-darwin-x64"
            filename: chdman
          - os: macos
            arch: arm64
            pkg: "@emmercm/chdman-darwin-arm64"
            filename: chdman
          - os: windows
            arch: x86_64
            pkg: "@emmercm/chdman-win32-x64"
            filename: chdman.exe

    steps:
      - name: Checkout OpenROM-bins
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract & Verify npm Package
        env:
          RAW_VERSION: ${ inputs.version }
          PKG: ${ matrix.target.pkg }
          FILENAME: ${ matrix.target.filename }
        run: |
          python3 -c '
          import os, sys, subprocess, json

          raw_ver = os.environ["RAW_VERSION"]
          pkg = os.environ["PKG"]
          filename = os.environ["FILENAME"]

          # Verify integrity via npm view
          print(f"Checking npm view {pkg}@{raw_ver}...")
          info_raw = subprocess.check_output(["npm", "view", f"{pkg}@{raw_ver}", "--json"]).decode()
          info = json.loads(info_raw)
          integrity = info.get("dist", {}).get("integrity", "")
          print("NPM dist.integrity:", integrity)

          # Download tarball
          tarball = subprocess.check_output(["npm", "pack", f"{pkg}@{raw_ver}"]).decode().strip()
          subprocess.check_call(["tar", "-xzf", tarball])

          os.makedirs("artifact_dir", exist_ok=True)
          extracted = os.path.join("package", "dist", filename)
          if not os.path.exists(extracted):
              sys.exit(f"Expected extracted binary at {extracted} not found!")

          dest = os.path.join("artifact_dir", filename)
          os.rename(extracted, dest)

          # Normalise version e.g. 0.289.0 -> mame0289
          clean_ver = raw_ver.replace(".", "").lstrip("0")
          mame_ver = f"mame0{clean_ver}"

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"MAME_VERSION={mame_ver}\n")
              f.write(f"DIST_INTEGRITY={integrity}\n")
          '

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chdman-${ matrix.target.os }-${ matrix.target.arch }
          path: artifact_dir/${ matrix.target.filename }

  publish-linux-x64:
    needs: extract-and-publish
    uses: ./.github/workflows/publish-sourceforge.yml
    with:
      os: linux
      arch: x86_64
      tool: chdman
      artifact_name: chdman-linux-x86_64
      version: mame0289
      toolchain: "npm package @emmercm/chdman-*"
      build_flavor: npm-extract
      dry_run: ${ inputs.dry_run }

  publish-linux-arm64:
    needs: extract-and-publish
    uses: ./.github/workflows/publish-sourceforge.yml
    with:
      os: linux
      arch: arm64
      tool: chdman
      artifact_name: chdman-linux-arm64
      version: mame0289
      toolchain: "npm package @emmercm/chdman-*"
      build_flavor: npm-extract
      dry_run: ${ inputs.dry_run }

  publish-macos-x64:
    needs: extract-and-publish
    uses: ./.github/workflows/publish-sourceforge.yml
    with:
      os: macos
      arch: x86_64
      tool: chdman
      artifact_name: chdman-macos-x86_64
      version: mame0289
      toolchain: "npm package @emmercm/chdman-*"
      build_flavor: npm-extract
      dry_run: ${ inputs.dry_run }

  publish-macos-arm64:
    needs: extract-and-publish
    uses: ./.github/workflows/publish-sourceforge.yml
    with:
      os: macos
      arch: arm64
      tool: chdman
      artifact_name: chdman-macos-arm64
      version: mame0289
      toolchain: "npm package @emmercm/chdman-*"
      build_flavor: npm-extract
      dry_run: ${ inputs.dry_run }

  publish-windows-x64:
    needs: extract-and-publish
    uses: ./.github/workflows/publish-sourceforge.yml
    with:
      os: windows
      arch: x86_64
      tool: chdman
      artifact_name: chdman-windows-x86_64
      version: mame0289
      toolchain: "npm package @emmercm/chdman-*"
      build_flavor: npm-extract
      dry_run: ${ inputs.dry_run }
