name: Update chdman

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'chdman version e.g. 0.289.0'
        required: true
        default: '0.289.0'

permissions:
  contents: write

jobs:
  update-chdman:
    name: Update chdman to v${{ github.event.inputs.version }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenROM-bins
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract chdman binaries from npm packages
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          mkdir -p linux/x86_64 linux/arm64 macos/arm64 macos/x86_64 windows/x86_64
          mkdir -p tmp_chdman && cd tmp_chdman

          echo "Installing chdman npm packages v${VERSION}..."

          # Linux x64
          mkdir pkg_linux_x64 && cd pkg_linux_x64
          npm init -y
          npm install --force --ignore-scripts @emmercm/chdman-linux-x64@${VERSION}
          find node_modules/@emmercm/chdman-linux-x64 -name "chdman" -type f -exec cp {} ../../linux/x86_64/chdman \;
          chmod +x ../../linux/x86_64/chdman
          cd .. && echo "✅ linux/x86_64/chdman"

          # Linux arm64
          mkdir pkg_linux_arm64 && cd pkg_linux_arm64
          npm init -y
          npm install --force --ignore-scripts @emmercm/chdman-linux-arm64@${VERSION}
          find node_modules/@emmercm/chdman-linux-arm64 -name "chdman" -type f -exec cp {} ../../linux/arm64/chdman \;
          chmod +x ../../linux/arm64/chdman
          cd .. && echo "✅ linux/arm64/chdman"

          # macOS arm64
          mkdir pkg_mac_arm64 && cd pkg_mac_arm64
          npm init -y
          npm install --force --ignore-scripts @emmercm/chdman-darwin-arm64@${VERSION}
          find node_modules/@emmercm/chdman-darwin-arm64 -name "chdman" -type f -exec cp {} ../../macos/arm64/chdman \;
          chmod +x ../../macos/arm64/chdman
          cd .. && echo "✅ macos/arm64/chdman"

          # macOS x64
          mkdir pkg_mac_x64 && cd pkg_mac_x64
          npm init -y
          npm install --force --ignore-scripts @emmercm/chdman-darwin-x64@${VERSION}
          find node_modules/@emmercm/chdman-darwin-x64 -name "chdman" -type f -exec cp {} ../../macos/x86_64/chdman \;
          chmod +x ../../macos/x86_64/chdman
          cd .. && echo "✅ macos/x86_64/chdman"

          # Windows x64
          mkdir pkg_win_x64 && cd pkg_win_x64
          npm init -y
          npm install --force --ignore-scripts @emmercm/chdman-win32-x64@${VERSION}
          find node_modules/@emmercm/chdman-win32-x64 -name "chdman.exe" -type f -exec cp {} ../../windows/x86_64/chdman.exe \;
          cd .. && echo "✅ windows/x86_64/chdman.exe"

          cd .. && rm -rf tmp_chdman

      - name: Update versions.json
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          python3 -c "
          import json
          with open('versions.json') as f:
              data = json.load(f)
          data['chdman'] = '$VERSION'
          with open('versions.json', 'w') as f:
              json.dump(data, f, indent=2)
          print('✅ versions.json updated')
          "

      - name: Commit and push
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub CI"
          git add -f linux/x86_64/chdman linux/arm64/chdman \
                     macos/arm64/chdman macos/x86_64/chdman \
                     windows/x86_64/chdman.exe versions.json
          git commit -m "chore: update chdman to v${VERSION}"
          git push origin main
          echo "✅ Pushed to main"
