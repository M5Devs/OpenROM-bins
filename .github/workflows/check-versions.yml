name: Check Binary Versions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  check-versions:
    name: Check Latest Upstream Versions
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenROM-bins
        uses: actions/checkout@v4

      - name: Check tool versions & notify
        env:
          GH_TOKEN: ${ secrets.GITHUB_TOKEN }
        run: |
          python3 -c '
          import json, urllib.request, os, subprocess

          with open("manifest.json") as f:
              manifest = json.load(f)

          tools = manifest.get("tools", {})

          def get_latest_github_tag(repo):
              url = f"https://api.github.com/repos/{repo}/releases"
              req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json"})
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      releases = json.load(r)
                      if releases:
                          return releases[0].get("tag_name", "").lstrip("v")
              except Exception as e:
                  pass
              return "unknown"

          updates = []
          for name, data in tools.items():
              curr_ver = data.get("version", "0.0.0")
              repo_url = data.get("upstream_repo", "")
              if "github.com/" in repo_url:
                  repo = repo_url.split("github.com/")[1].strip("/")
                  latest_tag = get_latest_github_tag(repo)
                  if latest_tag != "unknown" and latest_tag != curr_ver:
                      updates.append((name, curr_ver, latest_tag, repo_url))

          if updates:
              print(f"Found {len(updates)} updates available!")
              body = "### 🔔 Upstream Binary Updates Available\n\n| Tool | Current | Upstream | Repo |\n|---|---|---|---|\n"
              for name, curr, latest, repo in updates:
                  body += f"| \`{name}\` | \`{curr}\` | \`{latest}\` | [{repo}]({repo}) |\n"

              # Check existing issue
              issues_raw = subprocess.check_output(["gh", "issue", "list", "--search", "Upstream Binary Updates Available", "--json", "number"]).decode()
              issues = json.loads(issues_raw)
              if issues:
                  num = issues[0]["number"]
                  print(f"Updating issue #{num}...")
                  subprocess.check_call(["gh", "issue", "edit", str(num), "--body", body])
              else:
                  print("Creating new issue...")
                  subprocess.check_call(["gh", "issue", "create", "--title", "🔔 Upstream Binary Updates Available", "--body", body])
          else:
              print("All tools up to date!")
          '
