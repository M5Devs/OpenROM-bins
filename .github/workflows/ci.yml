name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Manifest & Run Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Forbid single-brace expressions
        run: |
          if grep -rnE '[$][{] ' .github/workflows; then
            echo "::error::single-brace expression found; use the double-brace form"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest yamllint

      - name: Validate YAML
        run: |
          yamllint -d "{rules: {line-length: disable, document-start: disable}}" .github/workflows/

      - name: Validate Manifest
        run: |
          python scripts/validate_manifest.py

      - name: Run Pytest Suite
        run: |
          pytest -v
