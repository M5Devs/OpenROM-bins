name: Check All Binary Versions

on:
  workflow_dispatch:

jobs:
  check-windows:
    name: Check Windows x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout OpenROM-bins
        uses: actions/checkout@v4

      - name: Fetch Windows Binaries
        shell: pwsh
        run: |
          .\scripts\fetch-bins.ps1 -Os "windows" -Arch "x86_64" -TargetDir ".\bin"

      - name: Test Execution & NKit Standalone
        shell: pwsh
        run: |
          $env:DOTNET_ROOT = ""
          $bins = Get-ChildItem ".\bin"
          foreach ($b in $bins) {
              Write-Host "Testing execution for $($b.Name) ..."
              & $b.FullName --help
          }

  check-linux-x64:
    name: Check Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenROM-bins
        uses: actions/checkout@v4

      - name: Fetch Linux x86_64 Binaries
        run: |
          ./scripts/fetch-bins.sh --os linux --arch x86_64 --target-dir ./bin

      - name: Test Execution & Scrubbed Env
        run: |
          export DOTNET_ROOT=""
          export PATH=$(echo "$PATH" | tr ":" "\n" | grep -v "dotnet" | tr "\n" ":")
          for f in ./bin/*; do
              echo "Testing $f ..."
              "$f" --help || "$f" --version || true
          done

  check-linux-arm64:
    name: Check Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout OpenROM-bins
        uses: actions/checkout@v4

      - name: Fetch Linux ARM64 Binaries
        run: |
          ./scripts/fetch-bins.sh --os linux --arch arm64 --target-dir ./bin

      - name: Test Execution
        run: |
          export DOTNET_ROOT=""
          for f in ./bin/*; do
              echo "Testing $f ..."
              "$f" --help || "$f" --version || true
          done

  check-macos-arm64:
    name: Check macOS ARM64
    runs-on: macos-15
    steps:
      - name: Checkout OpenROM-bins
        uses: actions/checkout@v4

      - name: Fetch macOS ARM64 Binaries
        run: |
          ./scripts/fetch-bins.sh --os macos --arch arm64 --target-dir ./bin

      - name: Verify Architecture & Execute
        run: |
          export DOTNET_ROOT=""
          for f in ./bin/*; do
              echo "File info for $f:"
              file "$f"
              "$f" --help || "$f" --version || true
          done

  check-macos-x64:
    name: Check macOS x86_64
    runs-on: macos-15-intel
    steps:
      - name: Checkout OpenROM-bins
        uses: actions/checkout@v4

      - name: Fetch macOS x86_64 Binaries
        run: |
          ./scripts/fetch-bins.sh --os macos --arch x86_64 --target-dir ./bin

      - name: Verify Architecture & Execute
        run: |
          export DOTNET_ROOT=""
          for f in ./bin/*; do
              echo "File info for $f:"
              file "$f"
              "$f" --help || "$f" --version || true
          done
